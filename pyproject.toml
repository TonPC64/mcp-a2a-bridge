[project]
name = "mcp-a2a-bridge"
version = "0.1.0"
description = "MCP server that lets coding agents call remote A2A agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3",
    "a2a-sdk[http-server]>=1.1,<2",
    "httpx>=0.28.1",
]

[project.scripts]
mcp-a2a-bridge = "mcp_a2a_bridge.server:main"
mcp-a2a-bridge-dashboard = "mcp_a2a_bridge.dashboard_service:main"
copilot-a2a-agent = "copilot_a2a_agent.server:main"

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "a2a-sdk[http-server]>=1.1,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_a2a_bridge", "src/copilot_a2a_agent"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/dist" = "mcp_a2a_bridge/dashboard_dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
